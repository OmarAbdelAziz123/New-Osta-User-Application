name: osta_user_app
description: "A new osta application."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

  #-------------------- PACKAGES --------------------#

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  async: ^2.11.0

  # Utility Package
  intl: ^0.19.0
  logger: ^2.0.1
  url_launcher: ^6.1.12
  flutter_native_splash: ^2.3.2
  floating_snackbar: any

  # Local Database
  shared_preferences: ^2.2.2

  # Icons
  iconsax_flutter: ^1.0.0

  # Animated Loading
  flutter_spinkit: ^5.2.0

  # State Management
  flutter_bloc: ^8.1.3

  # Make Banner
  carousel_slider: ^4.2.1

  # To Call Backend
  dio: ^5.4.0

  # Image Cach
  cached_network_image: ^3.3.0

  # Responsive Ui
  flutter_screenutil: ^5.9.0

  # Make Animation When Navigate
  page_transition: ^2.1.0

  # SVG Pictures
  flutter_svg: ^2.0.9

  # Custom Field On OTP
  pinput: ^4.0.0

  contacts_service: ^0.6.3
  permission_handler: any
  flutter_phone_direct_caller: any
  sim_data: any

  audio_waveforms: ^1.0.5

  flutter_sound: any
  path_provider: ^2.1.3
  draggable_bottom_sheet: ^1.0.2
  # Get Location
  geolocator: ^10.1.0
  location:
  geocoding:
  google_maps_flutter: ^2.7.0
  maps_launcher: ^2.2.1
  flutter_polyline_points: ^2.1.0
  google_places_flutter: ^2.0.9

  # Animation
  lottie: ^3.1.0

  # Images
  image_picker: ^1.1.2

  audioplayers: any

  socket_io_client: ^2.0.3+1
  shimmer: ^3.0.0

  #-------------------- PACKAGES End --------------------#

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:

  uses-material-design: true

  #-------------------- LOCAL ASSETS --------------------#

  assets:
    - assets/images/gifs/
    - assets/images/jpg/
    - assets/images/pngs/
    - assets/images/svgs/
    - assets/images/lotties/

  #-------------------- LOCAL FONTS --------------------#
  fonts:
#    - family: Urbanist
#      fonts:
#        - asset: assets/fonts/Urbanist-Regular.ttf
#          weight: 400
#        - asset: assets/fonts/Urbanist-Medium.ttf
#          weight: 500
#        - asset: assets/fonts/Urbanist-SemiBold.ttf
#          weight: 600
#        - asset: assets/fonts/Urbanist-Bold.ttf
#          weight: 800
    - family: CenturyGothicPaneuropean
      fonts:
        - asset: assets/fonts/CenturyGothicPaneuropeanRegular.ttf
          weight: 400
        - asset: assets/fonts/CenturyGothicPaneuropeanLight.ttf
          weight: 500
        - asset: assets/fonts/CenturyGothicPaneuropeanSemiBold.ttf
          weight: 600
        - asset: assets/fonts/CenturyGothicPaneuropeanBold.ttf
          weight: 800
